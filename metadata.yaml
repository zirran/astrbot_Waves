name: astrbot_plugin_waves
display_name: 海浪
desc: 记忆与日记的一体化插件：L1–L4 四层记忆、可信度加权、联想推理、作废与过期、自动归档与快照、每两周一篇带大纲的日记，并内置可交互的记忆星图。
version: 1.2.0
author: zirranya
repo: "https://github.com/zirran/astrbot_Waves"
astrbot_version: ">=4.17.0"
tags:
  - 记忆
  - 日记
  - 情感
  - 星图
  - 人格
help: |
  /记忆            四层状态
  /记忆 事实        看过长期记住了什么
  /记忆 整理        合并去重（管理员）
  /记忆 搜 关键词    翻永久存档
  /记忆 联想 关键词  看两跳联想链
  /日记            最近一篇（大纲+正文）
  /日记 大纲        只看大纲
  /日记 现在        立刻写一篇（管理员）
  /日记 合并        手动合并年度合集（管理员）
  /海浪            全层状态 + 门槛 + 备份